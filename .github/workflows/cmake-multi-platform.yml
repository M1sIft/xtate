name: Build CMake Project

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # 新增手动触发选项

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install \
          libpcap \
          openssl \
          pcre2 \
          libxml2 \
          lua@5.4 \
          libbson \
          mongocxx

    - name: Configure build environment
      run: |
        # 添加 OpenSSL 路径（如果需要）
        echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl)" >> $GITHUB_ENV
        # 添加其他环境变量（如果需要）

    - name: Build project
      run: |
        chmod +x ./build.sh
        ./build.sh    
